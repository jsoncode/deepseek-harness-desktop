# Release: on every `v*` tag push (or manual workflow_dispatch), build the
# Tauri app on Windows, macOS and Linux and publish the installers to a GitHub
# Release.
#
# 直接发布（非草稿）：
#   1. create-release job 先用 gh CLI 创建「已发布」的正式 Release（空壳）；
#   2. 各平台矩阵 job 构建安装包后，用 softprops/action-gh-release 把资产追加
#      到同一个正式 Release —— 全程不产生草稿，也不需要末尾的转正 job。
#   3. 不使用 tauri-action 的原因：它只认草稿，遇到已发布的 Release 会走错
#      分支导致部分产物丢失（见 tauri-action 多 job 并发上传的已知问题）。
#
# Outputs:
#   Windows: NSIS (.exe)
#   macOS:   .dmg (tauri native, per arch) + .pkg (built from the .app
#            with macOS' pkgbuild, since tauri does not support pkg natively)
#   Linux:   .deb + .rpm + .AppImage（在 ubuntu-22.04 上构建：glibc 向下兼容，
#            22.04 产物可在 22.04 及更新的发行版上运行；24.04 构建会抬高门槛）
#
# 产物命名：`dhd_{version}_{platform}[_{compat}]_{arch}[-setup].{ext}`，由
# scripts/tag-release-assets.mjs 在 build 之后改名（tauri 产物名写死在打包器里、
# 没有模板可配）。产品名统一缩成 `dhd`：短、且不含空格 —— 带空格时 GitHub 会把空格
# 替换成 `.`，下载页上的名字和本地产物名对不上，命令行里也得到处加引号。
# 脚本里的 --name 是这个前缀的唯一来源（默认 dhd）。
#   dhd_1.0.2_windows_x64-setup.exe
#   dhd_1.0.2_macos_arm64.dmg / dhd_1.0.2_macos_arm64.pkg
#   dhd_1.0.2_macos_x64.dmg   / dhd_1.0.2_macos_x64.pkg
#   dhd_1.0.2_linux_glibc2.35_amd64.deb
#   dhd_1.0.2_linux_glibc2.35_x86_64.rpm
#   dhd_1.0.2_linux_glibc2.35_x86_64.AppImage
#
# Linux 的 `glibc2.35` 是**兼容下限**，取自构建基线 ubuntu-22.04（glibc 2.35）：产物可在
# glibc ≥ 2.35 且装了 webkit2gtk-4.1 的系统上运行。写进文件名是因为只标 `linux_amd64`
# 用户无从判断自己的系统够不够，RHEL 9（glibc 2.34）、openSUSE Leap 15（2.31）、
# Ubuntu 20.04（无 webkit2gtk-4.1）这些低于基线的系统会下载后才发现跑不起来。
# 22.04 已是本技术栈（tauri v2 + webkit2gtk-4.1）能取到的最低基线，再往下压会失去
# webkit2gtk-4.1；因此**不再为各发行版单独打包**，Arch 等滚动发行版用 AppImage 即可。
# 这个 token 由 linux 腿的 "Verify glibc floor" 步骤实测校验，防止基线漂移后名字说谎。
#
# 注意：**只改产物文件名**。tauri.conf.json 的 productName 不动，安装后的应用名、.app、
# 窗口标题与卸载项仍然叫 DeepSeek Harness Desktop。
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0). Leave empty to use tauri.conf.json.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # Quality gate: 前端类型检查 + 构建 + Rust 单元测试通过后，才开始打安装包。
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 格式守卫：仓库曾有 37 处 rustfmt 漂移（dsh.rs / model_proxy.rs / tts.rs），
      # 用 --check 拦住新漂移，避免格式改动混进功能提交
      - name: Rust format check (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Frontend build (tsc + vite)
        run: pnpm build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

  # 先创建已发布的正式 Release（空壳，等矩阵 job 追加资产）。
  create-release:
    needs: quality
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      # 重跑/重推同 tag（或手动 dispatch）时，先清掉该 tag 已存在的 Release。
      # 只在这里做一次，避免多 job 并发删除的竞态。
      - name: Remove stale release for this tag
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
            echo "Deleted stale release for $TAG"
          else
            echo "No stale release for $TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # workflow_dispatch 路径下 tag 可能不存在，先补建（指向当前 checkout 的 commit）。
      - name: Create published release
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git tag "$TAG" 2>/dev/null || true
          cat > /tmp/release-notes.md <<EOF
          ## DeepSeek Harness Desktop ${TAG}

          DeepSeek Harness 本地服务桌面启动器：一键安装/启动 dsh web，并在内嵌预览页中打开本地服务。

          ### 下载
          文件名统一为 \`dhd_{版本}_{平台}_{架构}.{后缀}\`（dhd = DeepSeek Harness Desktop，装完还是这个名字），按平台对号入座：

          - **Windows**：\`dhd_${TAG#v}_windows_x64-setup.exe\`（NSIS 安装包）
          - **macOS Apple Silicon**：\`dhd_${TAG#v}_macos_arm64.dmg\` + \`dhd_${TAG#v}_macos_arm64.pkg\`
          - **macOS Intel**：\`dhd_${TAG#v}_macos_x64.dmg\` + \`dhd_${TAG#v}_macos_x64.pkg\`
          - **Linux x86_64**（名字里的 \`glibc2.35\` 就是兼容下限，见下）：
            - \`dhd_${TAG#v}_linux_glibc2.35_amd64.deb\` —— Debian / Ubuntu / Mint / Pop!_OS 等 dpkg 系
            - \`dhd_${TAG#v}_linux_glibc2.35_x86_64.rpm\` —— Fedora 36+ / openSUSE Tumbleweed 等 rpm 系（仓库需有 webkit2gtk4.1）
            - \`dhd_${TAG#v}_linux_glibc2.35_x86_64.AppImage\` —— **通用**：任何发行版，含 Arch / CachyOS 等滚动发行版

          ### Linux 支持范围
          三个包都构建在 \`ubuntu-22.04\` 上，因此要求 **glibc ≥ 2.35** 且系统提供 **webkit2gtk-4.1**。
          这是 tauri v2 + webkit2gtk-4.1 能取到的最低基线，所以**不为各发行版单独打包**：

          | 系统 | 可用产物 |
          | --- | --- |
          | Ubuntu 22.04+ / Debian 12+ / Mint 21+ / Pop!_OS 22.04+ | \`.deb\`（或 AppImage） |
          | Fedora 36+ / openSUSE Tumbleweed（rpm 系，仓库需提供 webkit2gtk4.1） | \`.rpm\`（或 AppImage） |
          | Arch / CachyOS / Manjaro 等滚动发行版 | \`.AppImage\` |
          | ❌ RHEL / Rocky / Alma 9（glibc 2.34）、openSUSE **Leap** 15.x（2.31）、Ubuntu 20.04（无 webkit2gtk-4.1） | 低于基线，不支持 |

          > macOS 未签名时，首次打开需在「系统设置 → 隐私与安全性」中允许，或右键选择「打开」。
          > Windows 若提示 SmartScreen，请选择「更多信息 → 仍要运行」。
          > Linux 的 .deb / .rpm 会自动声明 WebKitGTK 4.1、GTK3 与托盘依赖；AppImage 不含系统库，
          > 需目标机自备 \`webkit2gtk-4.1\` 与 \`libayatana-appindicator\`（Arch 上是
          > \`sudo pacman -S webkit2gtk-4.1 libayatana-appindicator\`）。AppImage 首次运行需 \`chmod +x\`。

          ### 功能
          - 启动封面一键启动本地服务（未启动时显示，已启动/启动中自动让位给状态页/预览页）
          - 首次使用自动全局安装 \`@deepseek-ai/dsh@latest\`
          - 模拟终端实时展示安装与启动日志，服务就绪后自动进入预览页
          - 预览页支持刷新 / 复制地址 / 浏览器打开

          完整说明见 [README](../blob/main/README.md)。
          EOF
          gh release create "$TAG" \
            --title "DeepSeek Harness Desktop ${TAG}" \
            --notes-file /tmp/release-notes.md
          echo "Published release $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 构建并上传安装包到已发布的 Release（直接发布，无草稿）。
  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            asset_platform: windows
            args: '--bundles nsis'
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            arch: arm64
            asset_platform: macos
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            arch: x64
            asset_platform: macos
            args: '--target x86_64-apple-darwin --bundles app,dmg'
          # Linux：固定 22.04 基线（见文件头 Outputs 说明）。AppImage 依赖
          # linuxdeploy/AppImage runtime 的在线下载，GitHub 托管 runner 可直接取到。
          - platform: ubuntu-22.04
            asset_platform: linux
            args: '--bundles deb,rpm,appimage'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux 打包依赖：webkit2gtk-4.1 / gtk3 为链接期硬依赖；appindicator 只装
      # **一个** dev 包——libappindicator3-dev 与 libayatana-appindicator3-dev 在
      # Ubuntu 22.04 上互相 Conflicts，同时装会让 apt 直接失败（E: Unable to correct
      # problems）。构建期其实不需要它（libappindicator-sys 走 libloading dlopen），
      # 装上是为了对齐 tauri 官方前置文档。
      # rpm：tauri 的 rpm 打包器需要 rpmbuild（rpm 包提供）。
      - name: Install Linux system deps (bundle)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf file wget rpm binutils

      - name: Sync version files
        shell: bash
        run: node scripts/sync-version.mjs "${{ needs.create-release.outputs.tag }}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm tauri build ${{ matrix.args }}

      # 产物改名：把 tauri 的产物名换成发布名 `dhd_{版本}_{平台}_{架构}`（如
      # dhd_1.0.2_windows_x64-setup.exe）。tauri-bundler 的名字写死在打包器里、
      # 没有模板配置项，只能在 build 之后改。脚本把改名后的绝对路径写进
      # $GITHUB_OUTPUT，下面 upload 直接用这份列表 —— 不再用 glob 匹配，避免改名与
      # glob 漂移导致漏传。
      #
      # 注意：三个平台的改名步骤必须用**不同的 step id**。同一个 job 内 step id
      # 必须唯一，三个都写 `id: tag` 会让整个 workflow 文件被判为非法——不是这一
      # 个 job 失败，而是 GitHub 直接拒绝解析、一个 job 都不创建（v1.0.3 / v1.0.4
      # 就是这么丢的：标签在、Release 没有）。只有 Linux build 不受影响照常绿，
      # 看起来像"只发 Linux"。
      - name: Tag platform into asset names (Windows)
        if: matrix.platform == 'windows-latest'
        id: tag-win
        shell: bash
        run: |
          node scripts/tag-release-assets.mjs \
            --platform '${{ matrix.asset_platform }}' \
            --version '${{ needs.create-release.outputs.version }}' \
            --github-output files \
            src-tauri/target/release/bundle/nsis

      - name: Upload NSIS installer (Windows)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ steps.tag-win.outputs.files }}
          # 列表由上面的改名步骤产出、且已校验文件存在；真出现未匹配就说明资产漏了，
          # 宁可让发版红掉，也不要静默少传一个安装包。
          fail_on_unmatched_files: true

      - name: Build .pkg installer (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          APP="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/DeepSeek Harness Desktop.app"
          pkgbuild --component "$APP" --install-location /Applications \
            "DeepSeek Harness Desktop_${VERSION}_${{ matrix.arch }}.pkg"

      # dmg（tauri 产出 aarch64/x86_64）与 pkg（pkgbuild 产出 arm64/x64）在这里
      # 统一归一成 `_macos_arm64` / `_macos_x64`，同一台机器上两个包名不再打架。
      - name: Tag platform into asset names (macOS)
        if: matrix.platform == 'macos-latest'
        id: tag-mac
        shell: bash
        run: |
          node scripts/tag-release-assets.mjs \
            --platform '${{ matrix.asset_platform }}' \
            --version '${{ needs.create-release.outputs.version }}' \
            --github-output files \
            "src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg" \
            "DeepSeek Harness Desktop_${{ needs.create-release.outputs.version }}_${{ matrix.arch }}.pkg"

      - name: Upload DMG + PKG (macOS)
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ steps.tag-mac.outputs.files }}
          # 列表由上面的改名步骤产出、且已校验文件存在；真出现未匹配就说明资产漏了，
          # 宁可让发版红掉，也不要静默少传一个安装包。
          fail_on_unmatched_files: true

      # AppImage 变薄：不要打包 WebKitGTK / GTK / GStreamer 这套栈，改用宿主自己的。
      #
      # 为什么必须这么做：linuxdeploy 会把 ldd 到的依赖（含按**构建机 Ubuntu 22.04** 编的
      # libwebkit2gtk-4.1）一起打进包，但**不打 libEGL/Mesa**——于是那份 WebKit 运行时撞的是
      # 宿主 Mesa。Mesa ≥ 26.1 会拒绝它调 eglGetPlatformDisplay() 的方式，直接
      #   Could not create default EGL display: EGL_BAD_PARAMETER. Aborting...
      # 窗口建得起来、WebView 一帧不画（主窗口黑、设置窗口白，取决于各自窗口底色）。
      # 失败点在 EGL display 创建，**早于** WebKit 读取任何渲染开关，所以任何环境变量都无效
      # （WEBKIT_DISABLE_DMABUF_RENDERER / WEBKIT_DISABLE_COMPOSITING_MODE /
      #  LIBGL_ALWAYS_SOFTWARE / EGL_PLATFORM=surfaceless 均实测无效）。
      #
      # 也不能反过来「把 Mesa/EGL 也打进去」：GPU 用户空间驱动必须匹配用户的**内核与显卡**，
      # 把构建时的 Mesa 冻进包，等于在比它新的显卡上直接不可用，滚动发行版永远追不上。
      #
      # 所以方向是相反的——**打包更少**：让 AppImage 只带应用自己（和 .deb 内容一致），
      # 图形栈全部走宿主，宿主那份天生配着宿主 Mesa 编译（这正是「源码构建能用」的原因）。
      # 落到的效果与 .deb 的依赖契约一致：宿主需有 webkit2gtk-4.1 / gtk3 / libayatana-appindicator。
      # 这一步纯自动化，用户不用做任何事。
      #
      # Tauri 的 AppImageConfig 只有 bundleMediaFramework / files，没有排除库的开关
      # （linuxdeploy 虽有 --exclude-library，Tauri 不透传），因此只能在这里后处理：
      # 解包 → 清掉包内所有 .so 与插件目录 → 用 appimagetool 重新打回 AppImage。
      - name: Slim the AppImage (use host WebKitGTK/GTK/GStreamer)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          AI=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          echo "原始 AppImage: $AI ($(du -h "$AI" | cut -f1))"

          sudo apt-get install -y squashfs-tools
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

          # 解包到临时目录：--appimage-extract 固定产出 ./squashfs-root
          rm -rf squashfs-root
          "$AI" --appimage-extract >/dev/null
          # 清掉包内所有共享库与插件目录（应用二进制与资源保留）
          rm -rf squashfs-root/usr/lib/*.so* \
                 squashfs-root/usr/lib/gstreamer-1.0 \
                 squashfs-root/usr/lib/webkit2gtk-4.1

          # 变薄成功的硬断言：不该再有任何 .so，"薄"才是修复本身
          if ls squashfs-root/usr/lib/*.so* >/dev/null 2>&1; then
            echo "::error::AppImage 里仍有打包的共享库，变薄没生效（下面这些库仍会让宿主 Mesa 报 EGL 错）"
            ls squashfs-root/usr/lib/ | head -40
            exit 1
          fi
          test -x "squashfs-root/AppRun" || { echo "::error::AppRun 丢失"; exit 1; }
          ls squashfs-root/*.desktop >/dev/null 2>&1 || { echo "::error::AppDir 根缺 .desktop"; exit 1; }

          # APPIMAGE_EXTRACT_AND_RUN=1：runner 上 FUSE 不可靠（tauri 调 linuxdeploy 时同样这么做），
          # 不设会直接 "fuse: device not found"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool squashfs-root /tmp/slim.AppImage >/dev/null
          test -s /tmp/slim.AppImage || { echo "::error::重新打包失败"; exit 1; }
          chmod +x /tmp/slim.AppImage

          # 重新打包后再验一次：runtime 与 squashfs 都得是好的
          rm -rf /tmp/verify && mkdir -p /tmp/verify && cd /tmp/verify
          /tmp/slim.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun || { echo "::error::重打包后的 AppImage 解不出 AppRun"; exit 1; }
          if ls squashfs-root/usr/lib/*.so* >/dev/null 2>&1; then
            echo "::error::重打包后又出现共享库"; exit 1
          fi
          cd "$GITHUB_WORKSPACE"

          mv /tmp/slim.AppImage "$AI"
          echo "变薄完成: $AI ($(du -h "$AI" | cut -f1))"

      # 校验文件名里的兼容下限没说谎：实测二进制引用到的最高 GLIBC 符号版本。
      # 构建机固定在 ubuntu-22.04（glibc 2.35），正常情况下实测就是 2.35；一旦有人
      # 换了 runner 或引入需要更新 glibc 的依赖，这里会红——否则用户会照着一个
      # 标着 glibc2.35、实际却要 2.38 的名字下载安装，然后在旧系统上莫名其妙地失败。
      - name: Verify glibc floor matches the filename token (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          BIN=src-tauri/target/release/deepseek-harness-desktop
          test -f "$BIN" || { echo "::error::未找到二进制 $BIN"; exit 1; }
          MAX=$(objdump -T "$BIN" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -Vu | tail -1 || true)
          # fail-closed：读不出符号版本（objdump 缺失 / 命令失败）也算失败，
          # 否则这条校验会静默通过、名字照样可能说谎
          if [ -z "$MAX" ]; then
            echo "::error::读不到 GLIBC 符号版本——objdump 是否可用？校验无法进行"
            exit 1
          fi
          echo "实测最高 GLIBC 符号版本: $MAX"
          declare -r EXPECTED=2.35
          if [ "$(printf '%s\n' "$EXPECTED" "$MAX" | sort -Vu | tail -1)" != "$EXPECTED" ]; then
            echo "::error::实测 glibc 下限 $MAX 高于产物名里声明的 $EXPECTED——请同步改文件名 token"
            exit 1
          fi
          echo "✓ 兼容下限与文件名声明的 glibc$EXPECTED 一致"

      - name: Tag platform into asset names (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        id: tag-linux
        shell: bash
        run: |
          node scripts/tag-release-assets.mjs \
            --platform '${{ matrix.asset_platform }}' \
            --version '${{ needs.create-release.outputs.version }}' \
            --compat 'glibc2.35' \
            --github-output files \
            src-tauri/target/release/bundle/deb \
            src-tauri/target/release/bundle/rpm \
            src-tauri/target/release/bundle/appimage

      - name: Upload Linux bundles (deb / rpm / AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ steps.tag-linux.outputs.files }}
          # 列表由上面的改名步骤产出、且已校验文件存在；真出现未匹配就说明资产漏了，
          # 宁可让发版红掉，也不要静默少传一个安装包。
          fail_on_unmatched_files: true
