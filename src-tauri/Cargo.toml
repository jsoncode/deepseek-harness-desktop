[package]
name = "deepseek-harness-desktop"
version = "0.1.22"
description = "DeepSeek Harness Desktop - a desktop shell for the local DeepSeek Harness web service"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 预览承载不再依赖多 webview：宿主经本地反向代理（proxy.rs）认证终结后以普通
# DOM iframe 嵌入，无需 tauri 的 unstable 多 webview API（Window::add_child）。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-snap-layout = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# 凭据配置文件（.credentials.yaml）格式校验与重写：与 dsh-credentials-local 的
# 文档 schema（version 1：refs/records 区段）保持一致
serde_yaml = "0.9"
ureq = "2"
# dsh 会话事件下行订阅（/api/events.mux）。`handshake` 是 client::connect 的必需特性
# （默认特性即含它），显式列出只为表达「刻意不要 TLS 相关默认项」——本机只连 loopback 明文 ws。
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

# 语音播报（tts.rs）：WAV 解码 + 本机音频输出（不受 WebView2 后台节流影响）。
# default-features = false 只留 wav（hound）：避免拉进 mp3/opus/vorbis 等
# 用不上的解码器。
rodio = { version = "0.19", default-features = false, features = ["wav"] }
# 语音合成工具（独立窗口）：hound 读/写 WAV（长文本分段合成后的拼接导出）
hound = "3.5"
# 语音合成工具的「另存为」系统对话框
tauri-plugin-dialog = "2"

# 系统推送（Windows）：两种 toast 实现并存，由 AppState::notify_style 切换
# （见 notify.rs 的 ToastStyle；设置页「两种提示切换开关」后续接入）。
# - notify-rust：原有实现，保留。default-features = false 是刻意的——默认特性会
#   拉进 Linux 专用的 zbus/dbus；版本上界锁 4.18（4.18 起要求 rustc 1.89，与
#   本 crate 的 MSRV 1.77.2 冲突）。
# - tauri-winrt-notification：直连 tauri 维护的 winrt fork，支持 toast 激活回调
#   （on_activated），实现「点击通知 → 打开对应会话对话框」。notify-rust 4.17 的
#   Windows 后端不注册激活回调（actions/激活均为 XDG/Linux 专属），故点击感知
#   必须用它。0.7.3 声明 rust-version 1.74，兼容本 crate 的 MSRV。
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
notify-rust = { version = ">=4.17, <4.18", default-features = false }
