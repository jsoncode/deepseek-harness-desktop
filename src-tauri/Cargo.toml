[package]
name = "harness-launcher"
version = "0.1.2"
description = "Harness Launcher - a desktop shell for the local DeepSeek Harness web service"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "harness_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
