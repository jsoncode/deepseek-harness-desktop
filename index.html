<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090d" />
    <title>DeepSeek Harness Desktop</title>
    <!-- 内联启动画面：在 bundle 下载/解析、React 首帧之前先画出与应用一致的底色与
         加载指示，避免「点开应用先白屏」的观感（窗口原生底色见 tauri.conf.json 的
         backgroundColor 与 lib.rs 里的按主题设置）。样式全部内联、不依赖任何外部
         资源，因此这一帧在几百毫秒内即可呈现。React 挂载后由 App.tsx 移除 #boot。 -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07090d;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #07090d;
        color: #eef1f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      #boot .boot-ring {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(99, 102, 241, 0.25);
        border-top-color: #6366f1;
        animation: boot-spin 0.9s linear infinite;
      }
      #boot .boot-title {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      #boot .boot-sub {
        font-size: 12.5px;
        color: #8b93a7;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* 跟随系统主题：浅色系统下底色与文字用应用浅色主题的取值 */
      @media (prefers-color-scheme: light) {
        html,
        body,
        #boot {
          background: #f6f7fb;
          color: #1c2129;
        }
        #boot .boot-sub {
          color: #6b7280;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <span class="boot-ring"></span>
      <div class="boot-title">DeepSeek Harness Desktop</div>
      <div class="boot-sub">正在启动服务…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
